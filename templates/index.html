<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard Global Ekotizimi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .module-card { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; padding: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .result-box { display: none; margin-top: 20px; padding: 15px; border-radius: 10px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-shield-halved text-primary me-2"></i>PhishGuard Pro AI Ekotizimi</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center mb-4">
            <div class="col-lg-10">
                <ul class="nav nav-pills nav-justified gap-2 bg-white p-2 rounded-4 border shadow-sm" id="pills-tab">
                    <li class="nav-item"><button class="nav-link active fw-bold" data-bs-toggle="pill" data-bs-target="#tab-url">URL Scanner</button></li>
                    <li class="nav-item"><button class="nav-link fw-bold" data-bs-toggle="pill" data-bs-target="#tab-card">CardGuard</button></li>
                    <li class="nav-item"><button class="nav-link fw-bold" data-bs-toggle="pill" data-bs-target="#tab-file">File & APK Shield</button></li>
                    <li class="nav-item"><button class="nav-link fw-bold" data-bs-toggle="pill" data-bs-target="#tab-msg">MessageGuard</button></li>
                </ul>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="tab-content">
                    <!-- URL Scanner -->
                    <div class="tab-pane fade show active" id="tab-url">
                        <div class="module-card">
                            <h4><i class="fa-solid fa-globe text-primary me-2"></i>URL va Domen Tahlili</h4>
                            <form id="urlForm" class="mt-3">
                                <div class="input-group input-group-lg">
                                    <input type="text" id="urlInput" class="form-control" placeholder="https://example.com" required>
                                    <button class="btn btn-primary px-4" type="submit">Tekshirish</button>
                                </div>
                            </form>
                            <div id="urlResult" class="result-box"></div>
                        </div>
                    </div>

                    <!-- CardGuard -->
                    <div class="tab-pane fade" id="tab-card">
                        <div class="module-card">
                            <h4><i class="fa-solid fa-credit-card text-primary me-2"></i>CardGuard — Karta Xavfsizligi</h4>
                            <form id="cardForm" class="mt-3">
                                <div class="input-group input-group-lg">
                                    <input type="text" id="cardInput" class="form-control" placeholder="16 xonali karta raqamini kiriting" maxlength="19" required>
                                    <button class="btn btn-primary px-4" type="submit">Validatsiya</button>
                                </div>
                            </form>
                            <div id="cardResult" class="result-box"></div>
                        </div>
                    </div>

                    <!-- File & APK Guard -->
                    <div class="tab-pane fade" id="tab-file">
                        <div class="module-card">
                            <h4><i class="fa-solid fa-file-shield text-primary me-2"></i>FileGuard & APK Shield</h4>
                            <form id="fileForm" class="mt-3">
                                <div class="input-group input-group-lg">
                                    <input type="file" id="fileInput" class="form-control" required>
                                    <button class="btn btn-primary px-4" type="submit">Yuklab Tahlil Qilish</button>
                                </div>
                            </form>
                            <div id="fileResult" class="result-box"></div>
                        </div>
                    </div>

                    <!-- MessageGuard -->
                    <div class="tab-pane fade" id="tab-msg">
                        <div class="module-card">
                            <h4><i class="fa-solid fa-comment-dots text-primary me-2"></i>MessageGuard — SMS Tahlili</h4>
                            <form id="msgForm" class="mt-3">
                                <textarea id="msgInput" class="form-control mb-3" rows="3" placeholder="Shubhali xabar matnini kiriting..." required></textarea>
                                <button class="btn btn-primary w-100 py-2 fw-bold" type="submit">Tahlil Qilish</button>
                            </form>
                            <div id="msgResult" class="result-box"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function handleCheck(endpoint, payload, resultDivId) {
            const resBox = document.getElementById(resultDivId);
            resBox.style.display = 'block';
            resBox.className = 'result-box alert alert-info';
            resBox.innerHTML = 'Tahlil qilinmoqda...';

            try {
                const response = await endpoint(payload);
                const data = await response.json();
                
                if (data.is_phishing || data.score >= 40) {
                    resBox.className = 'result-box alert alert-danger';
                    resBox.innerHTML = `<h5>⚠️ Xavf Aniqlandi! (Ball: ${data.score}/100)</h5><ul>` + data.reasons.map(r => `<li>${r}</li>`).join('') + `</ul>`;
                } else {
                    resBox.className = 'result-box alert alert-success';
                    resBox.innerHTML = `<h5>✅ Xavfsiz (Ball: ${data.score}/100)</h5><ul>` + data.reasons.map(r => `<li>${r}</li>`).join('') + `</ul>`;
                }
            } catch (err) {
                resBox.className = 'result-box alert alert-warning';
                resBox.innerHTML = 'Xatolik yuz berdi.';
            }
        }

        document.getElementById('urlForm').addEventListener('submit', (e) => {
            e.preventDefault();
            handleCheck(p => fetch('/api/check', {method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({type: 'url', url: p})}), document.getElementById('urlInput').value, 'urlResult');
        });

        document.getElementById('cardForm').addEventListener('submit', (e) => {
            e.preventDefault();
            handleCheck(p => fetch('/api/check', {method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({type: 'card', card: p})}), document.getElementById('cardInput').value, 'cardResult');
        });

        document.getElementById('msgForm').addEventListener('submit', (e) => {
            e.preventDefault();
            handleCheck(p => fetch('/api/check', {method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({type: 'message', message: p})}), document.getElementById('msgInput').value, 'msgResult');
        });

        document.getElementById('fileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('fileInput').files[0];
            const formData = new FormData();
            formData.append('file', fileInput);

            const resBox = document.getElementById('fileResult');
            resBox.style.display = 'block';
            resBox.className = 'result-box alert alert-info';
            resBox.innerHTML = 'Fayl yuklanib tahlil qilinmoqda...';

            try {
                const response = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await response.json();
                if (data.score >= 40) {
                    resBox.className = 'result-box alert alert-danger';
                    resBox.innerHTML = `<h5>⚠️ Xavfli Fayl (${data.filename})</h5><ul>` + data.reasons.map(r => `<li>${r}</li>`).join('') + `</ul>`;
                } else {
                    resBox.className = 'result-box alert alert-success';
                    resBox.innerHTML = `<h5>✅ Fayl Xavfsiz (${data.filename})</h5><ul>` + data.reasons.map(r => `<li>${r}</li>`).join('') + `</ul>`;
                }
            } catch (err) {
                resBox.className = 'result-box alert alert-warning';
                resBox.innerHTML = 'Faylni yuklashda xatolik.';
            }
        });
    </script>
</body>
</html>
