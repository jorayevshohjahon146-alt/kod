<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard Pro AI - Phishing Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-top: 50px;
        }
        .main-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 35px;
        }
        .result-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 main-card">
            <h2 class="text-center text-primary mb-3">🛡️ PhishGuard Pro AI</h2>
            <p class="text-center text-muted mb-4">Phishing va firibgarlik havolalarini tekshirish tizimi</p>

            <form id="checkForm">
                <div class="input-group input-group-lg mb-3">
                    <input type="text" id="urlInput" class="form-control" placeholder="Masalan: https://google.com" required autocomplete="off">
                    <button class="btn btn-primary px-4" type="submit" id="submitBtn">Tekshirish</button>
                </div>
            </form>

            <div id="resultBox" class="result-box">
                <h4 id="resultTitle" class="fw-bold"></h4>
                <div class="progress my-3" style="height: 20px;">
                    <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%;"></div>
                </div>
                <p id="resultScore" class="fw-bold fs-5"></p>
                <h6 class="fw-bold mt-3">Aniqlangan shubhali belgilar:</h6>
                <ul id="reasonsList" class="mb-0"></ul>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('checkForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const inputField = document.getElementById('urlInput');
        let url = inputField.value.trim();

        const submitBtn = document.getElementById('submitBtn');
        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const resultScore = document.getElementById('resultScore');
        const progressBar = document.getElementById('progressBar');
        const reasonsList = document.getElementById('reasonsList');

        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Tekshirilmoqda...';

        try {
            const response = await fetch('/api/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });

            const data = await response.json();

            resultBox.style.display = 'block';
            reasonsList.innerHTML = '';

            if (data.error) {
                resultBox.className = 'result-box alert alert-warning';
                resultTitle.textContent = '⚠️ Xatolik: ' + data.error;
                resultScore.textContent = '';
                progressBar.style.width = '0%';
            } else {
                const score = data.score;
                progressBar.style.width = score + '%';
                resultScore.textContent = 'Xavf darajasi: ' + score + ' / 100';

                if (data.is_phishing) {
                    resultBox.className = 'result-box alert alert-danger';
                    resultTitle.textContent = '⚠️ DIQQAT: Phishing bo\'lishi mumkin!';
                    progressBar.className = 'progress-bar bg-danger';
                } else {
                    resultBox.className = 'result-box alert alert-success';
                    resultTitle.textContent = '✅ Havola xavfsiz ko\'rinmoqda!';
                    progressBar.className = 'progress-bar bg-success';
                }

                if (data.reasons && data.reasons.length > 0) {
                    data.reasons.forEach(reason => {
                        const li = document.createElement('li');
                        li.textContent = reason;
                        reasonsList.appendChild(li);
                    });
                } else {
                    reasonsList.innerHTML = '<li>Shubhali belgilar aniqlanmadi.</li>';
                }
            }
        } catch (error) {
            resultBox.style.display = 'block';
            resultBox.className = 'result-box alert alert-danger';
            resultTitle.textContent = 'Server bilan aloqa o\'rnatishda xatolik yuz berdi!';
            resultScore.textContent = '';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Tekshirish';
        }
    });
</script>

</body>
</html>
