<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard Pro AI - Phishing Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-card {
            margin-top: 50px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background: white;
            padding: 30px;
        }
        .header-title {
            color: #0d6efd;
            font-weight: bold;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 main-card">
            <h2 class="text-center header-title mb-4">🛡️ PhishGuard Pro AI</h2>
            <p class="text-center text-muted">Vnesite povezavo (URL) za preverjanje lažnega predstavljanja (phishing):</p>
            
            <form id="checkForm">
                <div class="input-group mb-3">
                    <input type="text" id="urlInput" class="form-control form-control-lg" placeholder="https://example.com" required>
                    <button class="btn btn-primary btn-lg" type="submit">Preveri</button>
                </div>
            </form>

            <div id="resultBox" class="result-box">
                <h4 id="resultTitle"></h4>
                <p id="resultScore"></p>
                <ul id="reasonsList"></ul>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('checkForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const url = document.getElementById('urlInput').value;
        const resultBox = document.getElementById('resultBox');
        const resultTitle = document.getElementById('resultTitle');
        const resultScore = document.getElementById('resultScore');
        const reasonsList = document.getElementById('reasonsList');

        resultBox.style.display = 'block';
        resultBox.className = 'result-box alert alert-info';
        resultTitle.textContent = 'Preverjanje poteka...';
        resultScore.textContent = '';
        reasonsList.innerHTML = '';

        try {
            const response = await fetch('/api/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });

            const data = await response.json();

            if (data.is_phishing) {
                resultBox.className = 'result-box alert alert-danger';
                resultTitle.textContent = '⚠️ OPOZORILO: Možna lažna spletna stran (Phishing)!';
            } else {
                resultBox.className = 'result-box alert alert-success';
                resultTitle.textContent = '✅ Povezava je videti varna!';
            }

            resultScore.textContent = 'Stopnja tveganja: ' + data.score + '/100';

            if (data.reasons && data.reasons.length > 0) {
                data.reasons.forEach(reason => {
                    const li = document.createElement('li');
                    li.textContent = reason;
                    reasonsList.appendChild(li);
                });
            }
        } catch (error) {
            resultBox.className = 'result-box alert alert-warning';
            resultTitle.textContent = 'Napaka pri preverjanju povezave!';
        }
    });
</script>

</body>
</html>
